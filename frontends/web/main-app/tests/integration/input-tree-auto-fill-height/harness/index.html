<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Input Tree Auto Fill Height Harness</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f6f8fa;
        color: #24292f;
        font-family: Arial, sans-serif;
      }

      .harness-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        padding: 20px;
      }

      .harness-case {
        min-width: 0;
        padding: 12px;
        border: 1px solid #d0d7de;
        background: #fff;
      }

      .harness-case h2 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 600;
      }

      .bounded-tree-parent {
        height: 320px;
        min-height: 0;
      }

      .bounded-tree-parent > .tree-render-root {
        height: 100%;
        min-height: 0;
      }

      @media (max-width: 800px) {
        .harness-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div id="input-tree-auto-fill-height-status">Booting input tree harness...</div>
    <main class="harness-grid">
      <section class="harness-case">
        <h2>Auto fill with search</h2>
        <div class="bounded-tree-parent" data-testid="auto-fill-parent">
          <div id="auto-fill-tree-root" class="tree-render-root"></div>
        </div>
      </section>
      <section class="harness-case">
        <h2>Auto fill virtual tree</h2>
        <div class="bounded-tree-parent" data-testid="virtual-tree-parent">
          <div id="virtual-tree-root" class="tree-render-root"></div>
        </div>
      </section>
      <section class="harness-case">
        <h2>Default height</h2>
        <div id="default-tree-root"></div>
      </section>
      <section class="harness-case">
        <h2>Natural content height</h2>
        <div id="height-auto-tree-root"></div>
      </section>
      <section class="harness-case">
        <h2>Tree editor auto fill</h2>
        <div class="bounded-tree-parent" data-testid="tree-editor-auto-fill-parent">
          <div id="tree-editor-auto-fill-root" class="tree-render-root"></div>
        </div>
      </section>
      <section class="harness-case">
        <h2>Tree editor virtual auto fill</h2>
        <div class="bounded-tree-parent" data-testid="tree-editor-virtual-parent">
          <div id="tree-editor-virtual-root" class="tree-render-root"></div>
        </div>
      </section>
      <section class="harness-case">
        <h2>Tree editor default height</h2>
        <div id="tree-editor-default-root"></div>
      </section>
    </main>
  </body>
</html>
