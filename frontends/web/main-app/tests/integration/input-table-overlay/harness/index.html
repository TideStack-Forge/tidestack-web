<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Input Table Overlay Harness</title>
  </head>
  <body style="margin: 0; min-height: 100vh; background: #f6f8fa">
    <div
      id="input-table-overlay-playwright-harness-root"
      data-testid="input-table-overlay-harness-root"
      style="padding: 20px">
      <div
        id="input-table-overlay-playwright-status"
        data-testid="input-table-overlay-harness-status"
        style="margin-bottom: 12px; color: #57606a; font-size: 13px">
        Booting input-table overlay harness...
      </div>
      <div
        id="input-table-overlay-editor-root"
        style="min-height: calc(100vh - 64px); background: #fff; border: 1px solid #d0d7de"></div>
      <pre
        id="input-table-overlay-live-data"
        data-testid="input-table-overlay-live-data"
        style="margin-top: 16px; padding: 12px; background: #0d1117; color: #e6edf3; white-space: pre-wrap"></pre>
    </div>
  </body>
</html>
