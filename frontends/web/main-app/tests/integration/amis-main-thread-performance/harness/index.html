<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>AMIS Main Thread Performance Harness</title>
    <style>
      html,
      body,
      #amis-main-thread-performance-root {
        height: 100%;
        margin: 0;
      }
      #amis-main-thread-performance-status {
        padding: 8px 12px;
        font-family: sans-serif;
        font-size: 13px;
      }
      #amis-main-thread-performance-editor-root {
        height: calc(100% - 36px);
      }
    </style>
  </head>
  <body>
    <div id="amis-main-thread-performance-root">
      <div
        id="amis-main-thread-performance-status"
        data-testid="amis-main-thread-performance-status"
      >
        Loading AMIS main-thread performance harness...
      </div>
      <div
        id="amis-main-thread-performance-editor-root"
        data-testid="amis-main-thread-performance-editor-root"
      ></div>
    </div>
  </body>
</html>
