<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Input Table Lazy Delete Harness</title>
  </head>
  <body style="margin: 0; min-height: 100vh; background: #f6f8fa">
    <div
      id="input-table-lazy-delete-harness-root"
      style="padding: 20px">
      <div
        style="margin-bottom: 12px; color: #24292f; font-size: 14px; line-height: 1.6">
        <strong>InputTable 懒渲染删除按钮复现页</strong>
        <div id="input-table-lazy-delete-status" style="color: #57606a">
          Booting input-table lazy delete harness...
        </div>
        <div style="color: #57606a">
          操作提示：横向滚到最右侧，点击不同行的“删除”。预期：每次点击后行数减少，按钮不再出现“点了没反应”。
        </div>
      </div>
      <div
        id="input-table-lazy-delete-editor-root"
        style="min-height: 640px; background: #fff; border: 1px solid #d0d7de"></div>
      <pre
        id="input-table-lazy-delete-live-data"
        style="margin-top: 16px; padding: 12px; background: #0d1117; color: #e6edf3; white-space: pre-wrap"></pre>
    </div>
  </body>
</html>
